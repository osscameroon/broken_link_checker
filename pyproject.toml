[project]
name = "broken-link-checker"
version = "0.2.0"
description = "Check the broken links on a website"
readme = "README-PYPI.md"
authors = [
    { name = "Brady Fomegne", email = "brady.fomegne@outlook.com" }
]
requires-python = ">=3.10"
maintainers = [
    { name = "Sanix-Darker" } , { name = "pythonbrad" }
]

dependencies = [
    "coloredlogs",
    "requests-html",
    "lxml[html-clean]",
    "typer",
]

keywords = ["link", "url", "broken", "check"]

classifiers = [
    "Topic :: Internet :: WWW/HTTP",
]

[project.scripts]
blc = "blc.__main__:app"

[project.urls]
Source = "https://github.com/osscameroon/broken_link_checker"
Tracker = "https://github.com/osscameroon/broken_link_checker/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blc"]

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.build]
include = ["README-PYPI.md"]
